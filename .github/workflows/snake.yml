name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-green-light.svg
            dist/snake-green-dark.svg?palette=github-dark&color_snake=#37d67a
            dist/snake-gold-dark.svg?palette=github-dark&color_snake=#e63946&color_dots=#161b22,#5c4a12,#9a7a1c,#d4a72c,#f7c948

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
